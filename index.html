<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
    <title>Speech Translator</title>
  </head>
  <body class="flex items-center justify-center min-h-screen bg-zinc-100 p-4">
    <main class="bg-white rounded-xl shadow-sm p-8 w-full max-w-lg">
      <header class="text-center">
        <div
          class="w-16 h-16 bg-amber-100 text-amber-700 rounded-lg flex items-center justify-center mx-auto"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="size-8"
          >
            <path d="m5 8 6 6" />
            <path d="m4 14 6-6 2-3" />
            <path d="M2 5h12" />
            <path d="M7 2h1" />
            <path d="m22 22-5-10-5 10" />
            <path d="M14 18h6" />
          </svg>
        </div>

        <h1 class="text-2xl font-semibold mt-4">Speech Translator</h1>
        <p class="text-zinc-500 mt-2">Translate text. Hear every word.</p>
      </header>

      <form id="form" class="flex flex-col gap-4 mt-4">
        <div class="flex flex-col gap-1">
          <textarea
            id="text"
            placeholder="Enter text to translate..."
            class="p-4 rounded-md border border-zinc-200 focus:outline-none focus:border-amber-600 focus:ring-2 focus:ring-amber-600/20"
            rows="6"
            maxlength="1000"
          ></textarea>
        </div>
        <div class="flex flex-col gap-1">
          <label for="language" class="font-medium">Translate to</label>
          <select
            id="language"
            class="p-4 rounded-md border border-zinc-200 focus:outline-none focus:border-amber-600 focus:ring-2 focus:ring-amber-600/20"
          ></select>
        </div>
        <div class="flex flex-col gap-1">
          <label for="voice" class="font-medium">Voice</label>
          <select
            id="voice"
            class="p-4 rounded-md border border-zinc-200 focus:outline-none focus:border-amber-600 focus:ring-2 focus:ring-amber-600/20"
          ></select>
        </div>
        <button
          type="submit"
          class="p-2 rounded-md border border-transparent bg-amber-600 text-white font-medium hover:bg-amber-700 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed disabled:pointer-events-none"
        >
          Translate & Speak
        </button>
      </form>

      <section
        id="result"
        class="hidden mt-6 p-4 rounded-md bg-amber-50 border border-amber-100"
      >
        <h2 class="font-medium text-amber-900">Translation</h2>
        <p id="translated-text" class="mt-2 text-zinc-800"></p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
